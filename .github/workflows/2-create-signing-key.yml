name: 2 - Create Android signing key
on:
  workflow_dispatch:
    inputs:
      password:
        description: "Keystore password (6+ chars, remember it)"
        required: true
jobs:
  key:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Generate keystore
        env: { PW: "${{ inputs.password }}" }
        run: |
          keytool -genkeypair -keystore dar-upload.jks -alias dar-upload -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PW" -keypass "$PW" -dname "CN=Dar Al-Uloom, O=Dar Al-Uloom, C=SA"
          base64 -w0 dar-upload.jks > keystore-base64.txt
      - uses: actions/upload-artifact@v4
        with:
          name: signing-key-KEEP-SAFE
          path: |
            dar-upload.jks
            keystore-base64.txt
          retention-days: 1
