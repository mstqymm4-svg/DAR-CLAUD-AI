name: 3 - Build Android AAB
on: workflow_dispatch
jobs:
  aab:
    runs-on: ubuntu-latest
    env:
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install --no-audit --no-fund
      - name: Add Android (Capacitor) project
        run: |
          npm install --no-save --no-audit --no-fund @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx vite build
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.darululoom.app",
            "appName": "دار العلوم",
            "webDir": "dist",
            "android": { "allowMixedContent": false },
            "server": { "androidScheme": "https" }
          }
          JSON
          npx cap add android
          cat > patch-signing.mjs <<'JS'
          import { readFileSync, writeFileSync } from "node:fs";
          const p = "android/app/build.gradle";
          let s = readFileSync(p, "utf8");
          s = s.replace("apply plugin: 'com.android.application'\n", `apply plugin: 'com.android.application'

          def keystoreProps = new Properties()
          def keystoreFile = rootProject.file('keystore.properties')
          if (keystoreFile.exists()) { keystoreFile.withInputStream { keystoreProps.load(it) } }
          `);
          s = s.replace("    buildTypes {\n        release {", `    signingConfigs {
              release {
                  if (keystoreFile.exists()) {
                      storeFile rootProject.file(keystoreProps['storeFile'])
                      storePassword keystoreProps['storePassword']
                      keyAlias keystoreProps['keyAlias']
                      keyPassword keystoreProps['keyPassword']
                  }
              }
          }
          buildTypes {
              release {
                  if (keystoreFile.exists()) { signingConfig signingConfigs.release }`);
          if (!s.includes("signingConfigs.release")) throw new Error("patch failed");
          writeFileSync(p, s);
          JS
          node patch-signing.mjs
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > android/dar-upload.jks
          printf 'storeFile=dar-upload.jks\nstorePassword=%s\nkeyAlias=dar-upload\nkeyPassword=%s\n' "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > android/keystore.properties
      - run: npx cap sync android
      - run: cd android && ./gradlew bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: dar-al-uloom-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
